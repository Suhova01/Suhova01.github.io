# Конфигурация Decap CMS
backend:
  name: github
  repo: Suhova01/portfolio-site
  branch: main
  base_url: https://decap-proxy.asuhova.workers.dev
  auth_endpoint: /auth

media_folder: "public / images"
public_folder: "/images"

collections:
  - name: "pages"
    label: "Контент страниц"
    files:
      - name: "home"
        label: "Главная страница"
        file: "src/content/pages.json"
        file_key: "home"
        fields:
          - { label: "Ключ (Не менять)", name: "key", widget: "hidden", default: "home" }
          - { label: "Заголовок сайта", name: "title", widget: "string" }
          - { label: "Приветствие (Eyebrow)", name: "eyebrow", widget: "string" }
          - { label: "Вводный текст", name: "intro", widget: "text" }
          - label: "Блоки текста (Секции)"
            name: "sections"
            widget: "list"
            fields:
              - { label: "Заголовок блока", name: "heading", widget: "string" }
              - { label: "Текст блока", name: "body", widget: "text" }
          - { label: "Включить форму контактов?", name: "showContactForm", widget: "boolean" }

      - name: "portfolio_biografiya"
        label: "Портфолио: Биография"
        file: "src/content/pages.json"
        file_key: "portfolio/biografiya"
        fields:
          - { label: "Ключ (Не менять)", name: "key", widget: "hidden", default: "portfolio/biografiya" }
          - { label: "Заголовок страницы", name: "title", widget: "string" }
          - { label: "Рубрика", name: "eyebrow", widget: "string" }
          - label: "Блоки текста (Секции)"
            name: "sections"
            widget: "list"
            fields:
              - { label: "Заголовок блока", name: "heading", widget: "string" }
              - { label: "Текст блока", name: "body", widget: "text" }

      - name: "portfolio_dostizheniya"
        label: "Портфолио: Мои достижения"
        file: "src/content/pages.json"
        file_key: "portfolio/dostizheniya"
        fields:
          - { label: "Ключ (Не менять)", name: "key", widget: "hidden", default: "portfolio/dostizheniya" }
          - { label: "Заголовок страницы", name: "title", widget: "string" }
          - { label: "Рубрика", name: "eyebrow", widget: "string" }
          - label: "Блоки текста (Секции)"
            name: "sections"
            widget: "list"
            fields:
              - { label: "Заголовок блока", name: "heading", widget: "string" }
              - { label: "Текст блока", name: "body", widget: "text" }
          - label: "Фотографии достижений"
            name: "images"
            widget: "list"
            field: { label: "Фото", name: "image", widget: "image" }

      - name: "metodika_razrabotki"
        label: "Методика: Разработки"
        file: "src/content/pages.json"
        file_key: "metodika/razrabotki"
        fields:
          - { label: "Ключ (Не менять)", name: "key", widget: "hidden", default: "metodika/razrabotki" }
          - { label: "Заголовок страницы", name: "title", widget: "string" }
          - { label: "Рубрика", name: "eyebrow", widget: "string" }
          - label: "Блоки текста (Секции)"
            name: "sections"
            widget: "list"
            fields:
              - { label: "Заголовок блока", name: "heading", widget: "string" }
              - { label: "Текст блока", name: "body", widget: "text" }
          - label: "Документы для скачивания"
            name: "docs"
            widget: "list"
            fields:
              - { label: "Название файла", name: "name", widget: "string" }
              - { label: "Загрузить файл", name: "url", widget: "file" }

      - name: "gruppa_foto"
        label: "Моя группа: Фотогалерея"
        file: "src/content/pages.json"
        file_key: "gruppa/foto"
        fields:
          - { label: "Ключ (Не менять)", name: "key", widget: "hidden", default: "gruppa/foto" }
          - { label: "Заголовок страницы", name: "title", widget: "string" }
          - { label: "Рубрика", name: "eyebrow", widget: "string" }
          - label: "Загрузить фотографии в галерею"
            name: "images"
            widget: "list"
            field: { label: "Фото", name: "image", widget: "image" }

  - name: "settings"
    label: "Глобальные настройки"
    files:
      - name: "general"
        label: "Данные профиля воспитателя"
        file: "src/content/site.json"
        file_key: "person"
        fields:
          - { label: "ФИО Педагога", name: "name", widget: "string" }
          - { label: "Должность", name: "role", widget: "string" }
          - { label: "Место работы (Организация)", name: "org", widget: "string" }
          - { label: "Местоположение", name: "location", widget: "string" }
          - { label: "Email (для писем)", name: "email", widget: "string" }
          - { label: "Фотография профиля (Аватар)", name: "photo", widget: "image" }
