# Конфигурация Decap CMS
# Подробности по бэкендам — см. README.md в корне проекта

backend:
  name: github
  repo: Suhova01/portfolio-site   # например: nastya-suhova/portfolio-site
  branch: main
  base_url: https://decap-proxy.asuhova.workers.dev   # см. README, раздел "Авторизация для CMS"
  auth_endpoint: /auth

media_folder: "public/images"
public_folder: "/images"

collections:
  - name: "pages"
    label: "Страницы сайта"
    ffiles:
      - name: "home"
        label: "Главная страница сайта"
        file: "src/content/pages.json"
        file_key: ""
        fields:
          - { label: "Ключ страницы (не менять)", name: "key", widget: "hidden", default: "" }
          - { label: "Заголовок сайта", name: "title", widget: "string" }
          - { label: "Приветствие", name: "eyebrow", widget: "string" }
          - { label: "Вводный текст", name: "intro", widget: "text" }
          - label: "Блоки текста (Секции)"
            name: "sections"
            widget: "list"
            fields:
              - { label: "Заголовок блока", name: "heading", widget: "string" }
              - { label: "Текст блока", name: "body", widget: "text" }
          - { label: "Включить форму контактов?", name: "showContactForm", widget: "boolean" }

      - name: "biography"
        label: "Страница: Информация обо мне"
        file: "src/content/pages.json"
        file_key: "portfolio/biografiya"
        fields:
          - { label: "Ключ страницы (не менять)", name: "key", widget: "hidden", default: "portfolio/biografiya" }
          - { label: "Заголовок страницы", name: "title", widget: "string" }
          - { label: "Надзаголовок", name: "eyebrow", widget: "string" }
          - label: "Блоки текста (Секции)"
            name: "sections"
            widget: "list"
            fields:
              - { label: "Заголовок блока", name: "heading", widget: "string" }
              - { label: "Текст блока", name: "body", widget: "text" }

      # ПРИМЕЧАНИЕ: Decap CMS "files"-коллекция редактирует файл целиком по заданным полям.
      # Так как pages.json хранит ВСЕ страницы одним объектом, для удобного редактирования
      # каждой страницы отдельно рекомендуется разбить его на отдельные файлы:
      # src/content/pages/home.json, src/content/pages/portfolio-biografiya.json и т.д.
      # Ниже — пример конфигурации ПОСЛЕ такого разбиения (папка вместо одного файла):

  - name: "site_pages"
    label: "Разделы сайта"
    folder: "src/content/pages"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Заголовок", name: "title", widget: "string" }
      - { label: "Рубрика (эйброу)", name: "eyebrow", widget: "string", required: false }
      - { label: "Вступление", name: "intro", widget: "text", required: false }
      - label: "Блоки контента"
        name: "sections"
        widget: "list"
        required: false
        fields:
          - { label: "Заголовок блока", name: "heading", widget: "string" }
          - { label: "Текст", name: "body", widget: "text" }
      - label: "Фотографии"
        name: "images"
        widget: "list"
        required: false
        field: { label: "Изображение", name: "image", widget: "image" }
      - label: "Файлы для скачивания"
        name: "docs"
        widget: "list"
        required: false
        fields:
          - { label: "Название файла", name: "name", widget: "string" }
          - { label: "Файл", name: "url", widget: "file" }
